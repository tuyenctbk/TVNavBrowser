<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NaviTV Neon Runner — Offline TV Arcade</title>
<style>
  :root {
    --bg-dark: #071126;
    --cyan: #00E5FF;
    --gold: #FFC857;
    --magenta: #FF3366;
    --card: rgba(15, 28, 58, 0.88);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #10254c 0%, #071126 70%, #040914 100%);
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    color: #F8FAFC;
  }
  #hud {
    position: fixed; top: 20px; left: 28px; right: 28px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10; pointer-events: none;
  }
  .badge {
    background: var(--card);
    border: 1.5px solid rgba(0, 229, 255, 0.35);
    border-radius: 14px;
    padding: 10px 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; gap: 14px;
  }
  .title-brand {
    font-weight: 800; font-size: 18px; letter-spacing: 0.6px;
    color: var(--cyan);
  }
  .controls-hint {
    font-size: 13px; color: #94A3B8;
  }
  .score-box {
    font-size: 18px; font-weight: 700;
  }
  .score-val { color: var(--gold); font-size: 22px; margin-left: 6px; }
  canvas {
    display: block; width: 100vw; height: 100vh;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 10, 24, 0.72);
    backdrop-filter: blur(6px);
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: linear-gradient(145deg, rgba(16, 33, 68, 0.96), rgba(8, 18, 38, 0.96));
    border: 2px solid var(--cyan);
    border-radius: 22px;
    padding: 34px 44px;
    text-align: center;
    max-width: 540px;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
  }
  .panel h1 {
    font-size: 32px; color: var(--cyan); margin-bottom: 10px;
    text-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
  }
  .panel p {
    font-size: 16px; color: #CBD5E1; line-height: 1.5; margin-bottom: 22px;
  }
  .btn-play {
    display: inline-block;
    background: linear-gradient(90deg, #00E5FF, #00B4D8);
    color: #041022;
    font-weight: 800;
    font-size: 18px;
    padding: 14px 34px;
    border-radius: 999px;
    border: 3px solid #FFC857;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(255, 200, 87, 0.65);
    outline: none;
  }
</style>
</head>
<body>
  <div id="hud">
    <div class="badge">
      <span class="title-brand">⚡ NEON RUNNER TV</span>
      <span class="controls-hint">D-Pad ◀ ▶ Move Lanes · ▲ / OK Boost Shield · 100% Offline</span>
    </div>
    <div class="badge score-box">
      <span>SCORE <span id="score" class="score-val">0</span></span>
      <span style="margin-left:18px;">BEST <span id="best" class="score-val">0</span></span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <div class="panel">
      <h1 id="panelTitle">NEON RUNNER TV</h1>
      <p id="panelDesc">Dodge incoming cyber-barriers across 3 neon lanes using your TV Remote <b>D-Pad Left / Right</b>. Collect gold energy orbs and press <b>D-Pad Up or OK</b> to trigger an invincible pulse!</p>
      <button id="startBtn" class="btn-play" tabindex="0">PRESS OK TO LAUNCH</button>
    </div>
  </div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const panelTitle = document.getElementById('panelTitle');
  const panelDesc = document.getElementById('panelDesc');
  const startBtn = document.getElementById('startBtn');

  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  window.addEventListener('resize', () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });

  let bestScore = parseInt(localStorage.getItem('navitv_neon_best') || '0', 10);
  bestEl.textContent = bestScore;

  const LANES = [-1, 0, 1];
  let running = false;
  let score = 0;
  let speed = 7;
  let playerLane = 1; // index 0, 1, 2
  let playerX = 0;
  let shieldTimer = 0;
  let obstacles = [];
  let orbs = [];
  let stars = [];
  let gridOffset = 0;

  for (let i = 0; i < 65; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * (height * 0.55),
      r: Math.random() * 2 + 0.6,
      s: Math.random() * 0.4 + 0.1
    });
  }

  function resetGame() {
    score = 0;
    speed = 7.5;
    playerLane = 1;
    shieldTimer = 0;
    obstacles = [];
    orbs = [];
    scoreEl.textContent = '0';
    running = true;
    overlay.classList.add('hidden');
  }

  function gameOver() {
    running = false;
    if (score > bestScore) {
      bestScore = Math.floor(score);
      localStorage.setItem('navitv_neon_best', String(bestScore));
      bestEl.textContent = bestScore;
    }
    panelTitle.textContent = 'RUN COMPLETE · ' + Math.floor(score) + ' PTS';
    panelDesc.innerHTML = 'High Score: <b>' + bestScore + '</b> · Press <b>OK / Enter</b> on your TV remote to race again!';
    startBtn.textContent = 'PLAY AGAIN (OK)';
    overlay.classList.remove('hidden');
    startBtn.focus();
  }

  function moveLeft() {
    if (!running) return;
    if (playerLane > 0) playerLane--;
  }
  function moveRight() {
    if (!running) return;
    if (playerLane < 2) playerLane++;
  }
  function activateShield() {
    if (!running) {
      resetGame();
      return;
    }
    if (shieldTimer <= 0) {
      shieldTimer = 90;
    }
  }

  window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
      case 37: // Left
      case 65:
        e.preventDefault();
        moveLeft();
        break;
      case 39: // Right
      case 68:
        e.preventDefault();
        moveRight();
        break;
      case 38: // Up
      case 87:
      case 13: // Enter / DPAD_CENTER
      case 32: // Space
        e.preventDefault();
        activateShield();
        break;
    }
  });

  startBtn.addEventListener('click', () => {
    if (!running) resetGame();
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (!running) {
      resetGame();
      return;
    }
    if (e.clientX < width * 0.4) moveLeft();
    else if (e.clientX > width * 0.6) moveRight();
    else activateShield();
  });

  function spawnEntities() {
    if (Math.random() < 0.045) {
      const lane = Math.floor(Math.random() * 3);
      if (!obstacles.some(o => o.z < 0.28 && o.lane === lane)) {
        obstacles.push({ lane, z: 0.02 });
      }
    }
    if (Math.random() < 0.035) {
      const lane = Math.floor(Math.random() * 3);
      orbs.push({ lane, z: 0.02 });
    }
  }

  function update() {
    if (!running) return;
    score += 0.25;
    speed = Math.min(16, 7.5 + score * 0.008);
    scoreEl.textContent = Math.floor(score);

    if (shieldTimer > 0) shieldTimer--;
    gridOffset = (gridOffset + speed * 0.012) % 1;

    spawnEntities();

    const step = speed * 0.0024;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].z += step;
      if (obstacles[i].z >= 0.86 && obstacles[i].z <= 0.95 && obstacles[i].lane === playerLane) {
        if (shieldTimer > 20) {
          obstacles.splice(i, 1);
          score += 15;
          continue;
        } else {
          gameOver();
          return;
        }
      }
      if (obstacles[i].z > 1.15) obstacles.splice(i, 1);
    }

    for (let i = orbs.length - 1; i >= 0; i--) {
      orbs[i].z += step;
      if (orbs[i].z >= 0.84 && orbs[i].z <= 0.96 && orbs[i].lane === playerLane) {
        score += 25;
        orbs.splice(i, 1);
        continue;
      }
      if (orbs[i].z > 1.15) orbs.splice(i, 1);
    }
  }

  function project(laneIndex, z) {
    const horizonY = height * 0.42;
    const bottomY = height * 0.92;
    const y = horizonY + (bottomY - horizonY) * Math.pow(z, 1.55);
    const spread = (width * 0.06) + (width * 0.56) * Math.pow(z, 1.45);
    const laneOffset = LANES[laneIndex] * (spread * 0.36);
    const x = width * 0.5 + laneOffset;
    const scale = 0.2 + 0.95 * Math.pow(z, 1.45);
    return { x, y, scale };
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    const horizonY = height * 0.42;

    // Sky glow
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, '#050B1A');
    skyGrad.addColorStop(1, '#132A56');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, horizonY);

    // Stars
    ctx.fillStyle = '#E2E8F0';
    stars.forEach(st => {
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Retro synth sun
    const sunGrad = ctx.createLinearGradient(0, horizonY - 120, 0, horizonY);
    sunGrad.addColorStop(0, '#FFC857');
    sunGrad.addColorStop(1, '#FF3366');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(width * 0.5, horizonY - 12, 78, Math.PI, 0, false);
    ctx.fill();

    // Ground grid
    const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
    groundGrad.addColorStop(0, '#09152E');
    groundGrad.addColorStop(1, '#040914');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, horizonY, width, height - horizonY);

    ctx.strokeStyle = 'rgba(0, 229, 255, 0.32)';
    ctx.lineWidth = 2;
    [-1.5, -0.5, 0.5, 1.5].forEach(div => {
      ctx.beginPath();
      ctx.moveTo(width * 0.5 + div * width * 0.02, horizonY);
      ctx.lineTo(width * 0.5 + div * width * 0.22, height);
      ctx.stroke();
    });

    for (let i = 0; i < 8; i++) {
      const z = ((i + gridOffset) / 8);
      const y = horizonY + (height - horizonY) * Math.pow(z, 1.6);
      ctx.strokeStyle = `rgba(0, 229, 255, ${0.12 + z * 0.3})`;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // Draw Orbs
    orbs.forEach(o => {
      const p = project(o.lane, o.z);
      const r = 18 * p.scale;
      ctx.save();
      ctx.fillStyle = '#FFC857';
      ctx.shadowColor = '#FFC857';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(p.x, p.y - r, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Draw Obstacles
    obstacles.forEach(o => {
      const p = project(o.lane, o.z);
      const w = 88 * p.scale;
      const h = 52 * p.scale;
      ctx.save();
      ctx.fillStyle = '#FF3366';
      ctx.strokeStyle = '#FFC857';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#FF3366';
      ctx.shadowBlur = 18;
      ctx.fillRect(p.x - w * 0.5, p.y - h, w, h);
      ctx.strokeRect(p.x - w * 0.5, p.y - h, w, h);
      ctx.restore();
    });

    // Draw Player Craft
    const targetP = project(playerLane, 0.9);
    if (!playerX) playerX = targetP.x;
    playerX += (targetP.x - playerX) * 0.24;
    const py = targetP.y;

    ctx.save();
    const shipColor = shieldTimer > 20 ? '#FFC857' : '#00E5FF';
    ctx.shadowColor = shipColor;
    ctx.shadowBlur = 24;
    ctx.fillStyle = shipColor;
    ctx.beginPath();
    ctx.moveTo(playerX, py - 42);
    ctx.lineTo(playerX - 38, py + 8);
    ctx.lineTo(playerX + 38, py + 8);
    ctx.closePath();
    ctx.fill();

    if (shieldTimer > 20) {
      ctx.strokeStyle = 'rgba(255, 200, 87, 0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(playerX, py - 14, 52, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.focus();
  loop();
})();
</script>
</body>
</html>
