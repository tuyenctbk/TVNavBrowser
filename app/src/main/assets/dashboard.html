<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviTV Browser Start Page</title>
    <style>
        :root {
            --bg-color: #080c16;
            --bg-gradient: radial-gradient(circle at 50% 8%, #162440 0%, #080c16 82%);
            --card-bg: rgba(22, 33, 56, 0.78);
            --card-hover-bg: rgba(32, 49, 84, 0.96);
            --card-border: rgba(255, 255, 255, 0.09);
            --accent-color: #ffc857;
            --accent-soft: rgba(255, 200, 87, 0.16);
            --accent-glow: rgba(255, 200, 87, 0.38);
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --pill-bg: rgba(22, 33, 56, 0.65);
            --badge-bg: rgba(255, 255, 255, 0.1);
            --card-icon-bg: rgba(255, 255, 255, 0.06);
            --badge-free: #10b981;
            --badge-live: #ef4444;
            --badge-hd: #3b82f6;
            --badge-game: #a855f7;
        }

        /* Light Theme (Crisp, High-Contrast Modern TV Design) */
        html.theme-light, body.theme-light {
            --bg-color: #f1f5f9;
            --bg-gradient: radial-gradient(circle at 50% 8%, #ffffff 0%, #f1f5f9 85%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-hover-bg: #ffffff;
            --card-border: rgba(15, 23, 42, 0.12);
            --accent-color: #d97706;
            --accent-soft: rgba(217, 119, 6, 0.15);
            --accent-glow: rgba(217, 119, 6, 0.32);
            --text-color: #0f172a;
            --text-secondary: #475569;
            --pill-bg: rgba(226, 232, 240, 0.85);
            --badge-bg: rgba(15, 23, 42, 0.08);
            --card-icon-bg: rgba(15, 23, 42, 0.05);
        }

        html.theme-light .brand h1,
        body.theme-light .brand h1 {
            color: #0f172a;
        }

        html.theme-light .live-clock,
        body.theme-light .live-clock {
            color: #334155;
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        html.theme-light .clock-icon,
        body.theme-light .clock-icon {
            color: #d97706;
        }

        html.theme-light .engine-pill,
        body.theme-light .engine-pill {
            background: #e2e8f0;
            color: #334155;
            border-color: #cbd5e1;
        }

        html.theme-light .engine-pill:focus,
        body.theme-light .engine-pill:focus,
        html.theme-light .engine-pill:hover,
        body.theme-light .engine-pill:hover {
            color: #ffffff;
            background: #d97706;
            border-color: #d97706;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
        }

        html.theme-light .cat-tab,
        body.theme-light .cat-tab {
            background: #e2e8f0;
            color: #334155;
            border-color: #cbd5e1;
        }

        html.theme-light .cat-tab.active,
        body.theme-light .cat-tab.active {
            background: #fef3c7;
            color: #b45309;
            border-color: #d97706;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
        }

        html.theme-light .cat-tab:focus,
        body.theme-light .cat-tab:focus {
            color: #ffffff;
            background: #d97706;
            border-color: #d97706;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.38);
        }

        html.theme-light .section-title,
        body.theme-light .section-title {
            color: #1e293b;
        }

        html.theme-light .section-badge,
        body.theme-light .section-badge {
            background: #e2e8f0;
            color: #475569;
        }

        html.theme-light .card,
        body.theme-light .card {
            background-color: #ffffff;
            border-color: #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        html.theme-light .card:focus,
        body.theme-light .card:focus {
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.32);
            border-color: #d97706;
            background-color: #ffffff;
        }

        html.theme-light .card-label,
        body.theme-light .card-label {
            color: #0f172a;
        }

        html.theme-light .card-desc,
        body.theme-light .card-desc {
            color: #475569;
        }

        html.theme-light .card:focus .card-desc,
        body.theme-light .card:focus .card-desc {
            color: #0f172a;
        }

        *, *:focus, *:focus-visible, *:focus-within {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        @keyframes fadeUpIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            margin: 0;
            padding: 18px 40px 28px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header with Quick Search Engines & Live Clock */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #00e5ff 0%, #ffc857 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #080c16;
            font-size: 20px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .brand h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-color);
        }

        .brand h1 span {
            color: var(--accent-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Quick Search Engine Launcher Pills (No duplicate text input) */
        .engine-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .engine-label {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            margin-right: 2px;
        }

        .engine-pill {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 6px 13px;
            border-radius: 16px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
            outline: none;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .engine-pill:focus,
        .engine-pill:hover {
            background: var(--accent-color);
            color: #080c16;
            border-color: var(--accent-color);
            transform: scale(1.06);
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        .live-clock {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--pill-bg);
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .clock-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            color: var(--accent-color);
        }

        /* Category Tabs */
        .category-nav {
            display: flex;
            gap: 10px;
            margin: 0 -2px 14px;
            padding: 8px 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-tab:focus {
            background: var(--accent-color);
            color: #080c16;
            border-color: var(--accent-color);
            transform: scale(1.06);
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .cat-tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: var(--accent-soft);
        }

        /* Section Groups */
        .section-group {
            margin-bottom: 20px;
            animation: fadeUpIn 0.28s ease-out both;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .section-title {
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-badge {
            font-size: 10px;
            background: var(--badge-bg);
            padding: 3px 8px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Grid Layout - Padding ensures scaled cards and golden focus glows are never cut off */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 14px;
            margin: -6px -10px 14px;
            padding: 10px 10px;
        }

        @media (max-width: 900px) {
            body {
                padding: 14px 24px 22px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 12px;
            }
            .card {
                height: 90px;
                padding: 0 14px;
                gap: 12px;
            }
        }

        @media (min-width: 1600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 18px;
            }
            .card {
                height: 108px;
            }
        }

        /* Shortcut Cards */
        .card {
            position: relative;
            height: 98px;
            border-radius: 16px;
            overflow: hidden;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 16px;
            text-decoration: none;
            outline: none;
            gap: 14px;
        }

        .card:focus,
        .card:hover {
            transform: scale(1.04);
            border-color: var(--accent-color);
            background-color: var(--card-hover-bg);
            box-shadow: 0 8px 26px rgba(255, 200, 87, 0.35);
            z-index: 20;
        }

        .card-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--card-icon-bg);
            flex-shrink: 0;
            padding: 9px;
            transition: transform 0.2s ease;
        }

        .card:focus .card-icon-wrap,
        .card:hover .card-icon-wrap {
            transform: scale(1.08);
        }

        .card-icon-wrap svg {
            width: 100%;
            height: 100%;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        .card-label {
            color: var(--text-color);
            font-size: 15.5px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-badge {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .badge-free { background: rgba(16, 185, 129, 0.2); color: var(--badge-free); }
        .badge-live { background: rgba(239, 68, 68, 0.2); color: var(--badge-live); }
        .badge-hd { background: rgba(59, 130, 246, 0.2); color: var(--badge-hd); }
        .badge-game { background: rgba(168, 85, 247, 0.2); color: var(--badge-game); }

        .card-desc {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- Top Header: Brand + Direct Search Engine Shortcuts + Live Clock -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">N</div>
            <h1>NaviTV <span>Browser</span></h1>
        </div>
        <div class="header-right">
            <div class="engine-switcher" aria-label="Quick Search Engines">
                <span class="engine-label" id="quick-search-label">Quick Search:</span>
                <a class="engine-pill" href="https://www.google.com">Google</a>
                <a class="engine-pill" href="https://duckduckgo.com">DuckDuckGo</a>
                <a class="engine-pill" href="https://www.youtube.com">YouTube</a>
                <a class="engine-pill" href="https://en.wikipedia.org">Wikipedia</a>
                <a class="engine-pill" href="https://www.reddit.com">Reddit</a>
            </div>
            <div class="live-clock" id="live-clock">
                <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="live-clock-text"></span>
            </div>
        </div>
    </div>

    <!-- Category Tabs (Dynamically Populated) -->
    <div class="category-nav" id="category-nav">
        <!-- Rendered from JSON -->
    </div>

    <!-- Portal Sections Container (Dynamically Populated) -->
    <div id="portal-sections-container">
        <!-- Rendered from JSON -->
    </div>

    <script>
        var localizedLabels = {
            quickSearch: 'Quick Search:',
            allPortals: '✨ All Portals'
        };

        try {
            if (window.AndroidApp && typeof window.AndroidApp.getDashboardLabelsJson === 'function') {
                var parsedLabels = JSON.parse(window.AndroidApp.getDashboardLabelsJson());
                if (parsedLabels) {
                    if (parsedLabels.quickSearch) localizedLabels.quickSearch = parsedLabels.quickSearch;
                    if (parsedLabels.allPortals) localizedLabels.allPortals = parsedLabels.allPortals;
                }
            }
        } catch (e) {}

        var qsLabelEl = document.getElementById('quick-search-label');
        if (qsLabelEl) qsLabelEl.textContent = localizedLabels.quickSearch;

        // Locale-aware Live Clock
        function updateClock() {
            var now = new Date();
            var timeStr = '';
            try {
                var timePart = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                var datePart = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
                timeStr = timePart + ' · ' + datePart;
            } catch (e) {
                timeStr = now.toLocaleTimeString();
            }
            var el = document.getElementById('live-clock-text') || document.getElementById('live-clock');
            if (el) el.textContent = timeStr;
        }
        updateClock();
        setInterval(updateClock, 10000);

        // Category Filter
        function filterCategory(cat, btn) {
            var tabs = document.querySelectorAll('.cat-tab');
            tabs.forEach(function(t) { t.classList.remove('active'); });
            if (btn) btn.classList.add('active');

            var groups = document.querySelectorAll('.section-group');
            groups.forEach(function(g) {
                if (cat === 'all' || g.getAttribute('data-cat') === cat) {
                    g.style.display = 'block';
                } else {
                    g.style.display = 'none';
                }
            });
        }

        // Dynamic Light/Dark Theme Controller
        function applyTheme(isLight) {
            if (isLight) {
                document.documentElement.classList.add('theme-light');
                document.documentElement.classList.remove('theme-dark');
                if (document.body) {
                    document.body.classList.add('theme-light');
                    document.body.classList.remove('theme-dark');
                }
            } else {
                document.documentElement.classList.remove('theme-light');
                document.documentElement.classList.add('theme-dark');
                if (document.body) {
                    document.body.classList.remove('theme-light');
                    document.body.classList.add('theme-dark');
                }
            }
        }

        // Dynamic Portal Suggestions Renderer (filters out any duplicate top-bar native actions)
        function renderPortals(data) {
            if (!data || !data.categories) return;
            var navContainer = document.getElementById('category-nav');
            var sectionsContainer = document.getElementById('portal-sections-container');
            if (!navContainer || !sectionsContainer) return;

            var validCategories = data.categories.map(function(cat) {
                var filteredItems = (cat.items || []).filter(function(item) {
                    var u = (item.url || '').toLowerCase();
                    return u.indexOf('opennative') === -1;
                });
                return {
                    id: cat.id,
                    tabTitle: cat.tabTitle,
                    tabIcon: cat.tabIcon,
                    headerTitle: cat.headerTitle,
                    headerBadge: cat.headerBadge,
                    items: filteredItems
                };
            }).filter(function(cat) {
                return cat.items.length > 0;
            });

            // Build Category Tabs
            var tabsHtml = '<button class="cat-tab active" data-cat="all" onclick="filterCategory(\'all\', this)">' + localizedLabels.allPortals + '</button>';
            validCategories.forEach(function(cat) {
                tabsHtml += '<button class="cat-tab" data-cat="' + cat.id + '" onclick="filterCategory(\'' + cat.id + '\', this)">' + cat.tabIcon + ' ' + cat.tabTitle + '</button>';
            });
            navContainer.innerHTML = tabsHtml;

            // Build Category Sections and Cards
            var sectionsHtml = '';
            validCategories.forEach(function(cat, idx) {
                var delay = (idx * 0.05).toFixed(2);
                sectionsHtml += '<div class="section-group" data-cat="' + cat.id + '" style="animation-delay:' + delay + 's;">';
                sectionsHtml += '  <div class="section-header">';
                sectionsHtml += '    <div class="section-title">';
                sectionsHtml += '      <span>' + cat.tabIcon + ' ' + cat.headerTitle + '</span>';
                sectionsHtml += '      <span class="section-badge">' + cat.headerBadge + '</span>';
                sectionsHtml += '    </div>';
                sectionsHtml += '  </div>';
                sectionsHtml += '  <div class="grid">';
                cat.items.forEach(function(item) {
                    sectionsHtml += '    <a href="' + item.url + '" class="card ' + (item.cardClass || '') + '">';
                    sectionsHtml += '      <div class="card-icon-wrap">';
                    sectionsHtml += '        <svg viewBox="0 0 24 24" fill="' + item.fill + '">';
                    sectionsHtml += '          <path d="' + item.path + '"/>';
                    sectionsHtml += '        </svg>';
                    sectionsHtml += '      </div>';
                    sectionsHtml += '      <div class="card-info">';
                    sectionsHtml += '        <div class="card-title-row">';
                    sectionsHtml += '          <span class="card-label">' + item.title + '</span>';
                    sectionsHtml += '          <span class="card-badge ' + (item.badgeClass || '') + '">' + item.badge + '</span>';
                    sectionsHtml += '        </div>';
                    sectionsHtml += '        <span class="card-desc">' + item.desc + '</span>';
                    sectionsHtml += '      </div>';
                    sectionsHtml += '    </a>';
                });
                sectionsHtml += '  </div>';
                sectionsHtml += '</div>';
            });
            sectionsContainer.innerHTML = sectionsHtml;

            // Check URL hash for category deep link (e.g. #arcade, #video, #news, #tools)
            function applyHash() {
                var hash = (window.location.hash || '').replace('#', '');
                if (hash) {
                    var targetBtn = document.querySelector('.cat-tab[data-cat="' + hash + '"]');
                    if (targetBtn) {
                        filterCategory(hash, targetBtn);
                    }
                }
            }
            applyHash();
            window.addEventListener('hashchange', applyHash);
        }

        function loadSuggestions() {
            var jsonStr = null;
            try {
                if (window.AndroidApp && typeof window.AndroidApp.getSuggestionsJson === 'function') {
                    jsonStr = window.AndroidApp.getSuggestionsJson();
                }
            } catch (e) {}

            if (jsonStr) {
                try {
                    renderPortals(JSON.parse(jsonStr));
                    return;
                } catch (e) {}
            }

            // Fallback: fetch from assets asynchronously
            fetch('portal_suggestions.json')
                .then(function(res) { return res.json(); })
                .then(function(data) { renderPortals(data); })
                .catch(function(err) { console.error('Failed to load portal suggestions:', err); });
        }

        // Initialize immediately
        try {
            if (window.AndroidApp && typeof window.AndroidApp.isLightTheme === 'function') {
                applyTheme(window.AndroidApp.isLightTheme());
            }
        } catch (e) {}
        loadSuggestions();
    </script>
</body>
</html>
