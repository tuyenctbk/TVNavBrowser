<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviTV Browser Start Page</title>
    <style>
        :root {
            --bg-color: #0b1020;
            --card-bg: rgba(28, 38, 64, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ffc857;
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 32px 48px;
            background: radial-gradient(circle at 50% 20%, #17223b 0%, #0b1020 85%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ffc857 0%, #e6a819 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #0b1020;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(255, 200, 87, 0.35);
        }

        .brand h1 {
            font-size: 26px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand h1 span {
            color: var(--accent-color);
        }

        /* Search Bar Area */
        .search-area {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 640px;
        }

        .search-input {
            width: 100%;
            height: 52px;
            background-color: rgba(28, 38, 64, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 200, 87, 0.25);
            border-radius: 14px;
            padding: 0 52px 0 22px;
            color: var(--text-color);
            font-size: 17px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .search-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(28, 38, 64, 0.95);
            box-shadow: 0 0 24px rgba(255, 200, 87, 0.3);
            transform: scale(1.02);
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Section Titles */
        .section-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 10px 0 16px 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Shortcut Cards */
        .card {
            position: relative;
            height: 100px;
            border-radius: 14px;
            overflow: hidden;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            outline: none;
        }

        .card:focus {
            transform: scale(1.08);
            border-color: var(--accent-color);
            box-shadow: 0 8px 32px rgba(255, 200, 87, 0.35);
            z-index: 10;
        }

        .card-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            margin-bottom: 6px;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: color 0.2s;
        }

        .card:focus .card-label {
            color: var(--text-color);
        }

        /* Card custom gradients */
        .card-youtube:focus { background: linear-gradient(145deg, rgba(230, 33, 23, 0.3), rgba(28, 38, 64, 0.9)); }
        .card-netflix:focus { background: linear-gradient(145deg, rgba(229, 9, 20, 0.3), rgba(28, 38, 64, 0.9)); }
        .card-twitch:focus { background: linear-gradient(145deg, rgba(145, 70, 255, 0.3), rgba(28, 38, 64, 0.9)); }
        .card-prime:focus { background: linear-gradient(145deg, rgba(0, 168, 225, 0.3), rgba(28, 38, 64, 0.9)); }
        .card-disney:focus { background: linear-gradient(145deg, rgba(17, 60, 207, 0.3), rgba(28, 38, 64, 0.9)); }
        .card-reddit:focus { background: linear-gradient(145deg, rgba(255, 69, 0, 0.3), rgba(28, 38, 64, 0.9)); }

        /* Tip Banner */
        .tip-banner {
            margin-top: auto;
            background-color: rgba(28, 38, 64, 0.65);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .tip-icon {
            background: linear-gradient(135deg, #ffc857 0%, #e6a819 100%);
            color: #0b1020;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            flex-shrink: 0;
        }

        .tip-text {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .tip-text b { color: var(--text-color); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <div class="brand-icon">N</div>
            <h1>Navi<span>TV</span> Browser</h1>
        </div>
    </div>

    <div class="search-area">
        <div class="search-box">
            <form action="https://www.google.com/search" method="get">
                <input class="search-input" type="text" name="q" placeholder="Search Google or enter address" autocomplete="off" />
                <div class="search-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </form>
        </div>
    </div>

    <div class="section-title">Streaming & Popular Sites</div>
    <div class="grid" id="shortcuts-grid">
        <a href="https://www.youtube.com" class="card card-youtube">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#FF0000">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </div>
            <div class="card-label">YouTube</div>
        </a>

        <a href="https://www.netflix.com" class="card card-netflix">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#E50914">
                    <path d="M4 0h4.22v15.68L15.78 0H20v24h-4.22V8.32L8.22 24H4V0z"/>
                </svg>
            </div>
            <div class="card-label">Netflix</div>
        </a>

        <a href="https://www.twitch.tv" class="card card-twitch">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#9146FF">
                    <path d="M2.149 0L.537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612l-3.582 3.582H12l-3.045 3.045v-3.045H4.836V2.149h16.477v11.463zm-8.955-6.627h2.149v6.269h-2.149V6.985zm4.657 0h2.149v6.269h-2.149V6.985z"/>
                </svg>
            </div>
            <div class="card-label">Twitch</div>
        </a>

        <a href="https://www.amazon.com/Prime-Video" class="card card-prime">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#00A8E1">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                </svg>
            </div>
            <div class="card-label">Prime Video</div>
        </a>

        <a href="https://www.disneyplus.com" class="card card-disney">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#113CCF">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm1 17h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </div>
            <div class="card-label">Disney+</div>
        </a>

        <a href="https://www.reddit.com" class="card card-reddit">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="#FF4500">
                    <path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.702zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.197-2.512-.73a.326.326 0 0 0-.232-.095z"/>
                </svg>
            </div>
            <div class="card-label">Reddit</div>
        </a>
    </div>

    <div class="tip-banner">
        <div class="tip-icon">&#10022;</div>
        <div class="tip-text">
            <b>TV Remote Controls:</b> Use the D-Pad arrows to move between buttons, and press <b>OK</b> to select. Press <b>Back</b> anytime to return to the toolbar.
        </div>
    </div>

</body>
</html>
